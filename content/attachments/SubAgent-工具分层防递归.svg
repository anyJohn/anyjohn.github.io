<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" font-family="system-ui, -apple-system, sans-serif">
  <rect width="1000" height="570" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e1e1e">工具分层：防止 SubAgent 无限递归</text>

  <!-- Layer 1: Main Agent -->
  <rect x="30" y="55" width="940" height="90" rx="6" fill="#a5d8ff" stroke="#1971c2" stroke-width="2"/>
  <text x="50" y="80" font-size="20" font-weight="bold" fill="#1971c2">Main Agent（顶层）</text>
  <text x="50" y="105" font-size="15" fill="#1e1e1e">可用工具：bash  |  read  |  write  |  edit  |  <tspan font-weight="bold" fill="#e03131">plan</tspan>  |  <tspan font-weight="bold" fill="#e03131">subagent</tspan></text>
  <text x="50" y="128" font-size="12" fill="#495057">可以 spawn SubAgent 和 Plan subtask，拥有完整上下文（Messages + Memory + Rules）</text>

  <!-- Arrow 1: Layer1 → Layer2 (allowed) -->
  <line x1="320" y1="148" x2="320" y2="220" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="320" y="188" text-anchor="middle" font-size="13" fill="#2f9e44" font-weight="bold">✓ 可以 spawn</text>

  <!-- Layer 2: SubAgent / Plan Subtask -->
  <rect x="30" y="230" width="940" height="90" rx="6" fill="#b2f2bb" stroke="#2f9e44" stroke-width="2"/>
  <text x="50" y="255" font-size="20" font-weight="bold" fill="#2f9e44">SubAgent / Plan Subtask（子层级）</text>
  <text x="50" y="280" font-size="15" fill="#1e1e1e">可用工具：bash  |  read  |  write  |  edit</text>
  <text x="50" y="303" font-size="12" fill="#495057">不能 spawn SubAgent 或 Plan！只能执行具体的读/写/bash 任务，独立 Messages，最多 10 轮</text>

  <!-- Arrow 2: Layer2 → Layer3 (blocked) -->
  <line x1="320" y1="323" x2="320" y2="400" stroke="#adb5bd" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="295" y1="355" x2="345" y2="375" stroke="#e03131" stroke-width="3"/>
  <line x1="295" y1="375" x2="345" y2="355" stroke="#e03131" stroke-width="3"/>
  <text x="320" y="365" text-anchor="middle" font-size="13" fill="#e03131" font-weight="bold">✗ 不能 spawn！</text>

  <!-- Layer 3: Dead end -->
  <rect x="30" y="400" width="940" height="55" rx="6" fill="#e9ecef" stroke="#adb5bd" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="50" y="425" font-size="16" fill="#868e96">SubAgent → SubAgent → ... （已被切断，不存在）</text>
  <text x="50" y="445" font-size="11" fill="#adb5bd">工具集由代码常量定义，LLM 无权选择 SubAgent 是否拥有 subagent 工具</text>

  <!-- Summary -->
  <rect x="100" y="475" width="800" height="65" rx="6" fill="#fff3bf" stroke="#f08c00" stroke-width="1"/>
  <text x="500" y="498" text-anchor="middle" font-size="15" fill="#e8590c" font-weight="bold">设计原则</text>
  <text x="500" y="522" text-anchor="middle" font-size="14" fill="#e8590c">给 LLM 工具时，想清楚哪些工具在什么层级可以用，什么层级不能用</text>

  <defs>
    <marker id="arrowGreen" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2f9e44"/>
    </marker>
  </defs>
</svg>
