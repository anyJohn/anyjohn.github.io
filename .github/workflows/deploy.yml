name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          # The cache stores pre-built plugin dist/, and `npx quartz plugin
          # install` skips rebuilding whenever the plugin directory already
          # exists. So the key must change whenever the build pipeline or any
          # pinned plugin version changes — otherwise a stale dist/ (e.g. the
          # graph bundle with utils 0.1.0's buggy getFullSlugFromUrl) gets
          # reused as-is. Hashing the CLI and plugin loader makes pipeline
          # changes (like the decodeURI patch in plugin-git-handlers.js) bust
          # the cache. No restore-keys: a partial fallback would restore an
          # old dist/ the install step would then skip-reuse, defeating the fix.
          key: ${{ runner.os }}-plugins-v5-${{ hashFiles('quartz.lock.json', 'quartz/cli/**', 'quartz/plugins/loader/**') }}
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
