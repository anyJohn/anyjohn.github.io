name: Deploy Quartz site to GitHub Pages

on:
  push:
    branches:
      - v5

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Quartz plugins
        uses: actions/cache@v4
        with:
          path: .quartz/plugins
          # Hashing the plugin loader too (and bumping the v3 prefix) makes a
          # change to the build pipeline — e.g. the unpin-@quartz-community/utils
          # fix in gitLoader.ts — invalidate the cached, pre-built plugin bundles.
          # Without this (and the matching v3 restore-keys), `npx quartz plugin
          # install` would reuse the stale cached dist/ — including the pre-built
          # graph bundle that ships utils 0.1.0 — and never pick up the fix.
          key: ${{ runner.os }}-plugins-v3-${{ hashFiles('quartz.lock.json', 'quartz/plugins/loader/**') }}
          restore-keys: |
            ${{ runner.os }}-plugins-v3-
      - name: Install Dependencies
        run: npm ci
      - name: Install Quartz plugins
        run: npx quartz plugin install
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
